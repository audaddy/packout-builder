[theme]
base = "dark"
primaryColor = "#DB0007"
backgroundColor = "#121212"
secondaryBackgroundColor = "#2A2A2A"
textColor = "#FFFFFF"

[server]
headless = true
address = "127.0.0.1"      # this computer only; change to 0.0.0.0 to share on your network
enableStaticServing = true

[browser]
gatherUsageStats = false
